# Auth module schemas

AdminUser:
  type: object
  required:
    - id
    - email
    - name
    - role
    - active
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique user identifier
    email:
      type: string
      format: email
      description: User email (login)
      example: "admin@itsolutions.pl"
    name:
      type: string
      description: User's display name
      example: "Jan Kowalski"
    role:
      $ref: '#/AdminRole'
    active:
      type: boolean
      description: Whether the user is active
      default: true
    lastLogin:
      type: string
      format: date-time
      description: Last login timestamp
    createdAt:
      type: string
      format: date-time

AdminRole:
  type: string
  enum:
    - admin
    - viewer
  default: admin
  description: |
    User role:
    - admin: Full access (read + write)
    - viewer: Read-only access

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: User email
      example: "admin@itsolutions.pl"
    password:
      type: string
      format: password
      minLength: 8
      description: User password
      example: "secretpassword123"

LoginResponse:
  type: object
  required:
    - accessToken
    - refreshToken
    - expiresIn
    - user
  properties:
    accessToken:
      type: string
      description: JWT access token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    refreshToken:
      type: string
      description: JWT refresh token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
    tokenType:
      type: string
      default: Bearer
      example: "Bearer"
    expiresIn:
      type: integer
      format: int64
      description: Access token expiration time in seconds
      example: 86400
    user:
      $ref: '#/AdminUser'

RefreshTokenRequest:
  type: object
  required:
    - refreshToken
  properties:
    refreshToken:
      type: string
      description: Refresh token
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

RefreshTokenResponse:
  type: object
  required:
    - accessToken
    - expiresIn
  properties:
    accessToken:
      type: string
      description: New JWT access token
    refreshToken:
      type: string
      description: New refresh token (if rotated)
    expiresIn:
      type: integer
      format: int64
      description: Access token expiration time in seconds

CurrentUserResponse:
  type: object
  required:
    - user
  properties:
    user:
      $ref: '#/AdminUser'
