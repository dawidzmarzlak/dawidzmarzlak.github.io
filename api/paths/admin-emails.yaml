# Admin Emails API paths

emailLogs:
  get:
    tags:
      - admin-emails
    operationId: getEmailLogs
    summary: List email logs
    description: Returns paginated list of sent emails
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/page'
      - $ref: '../components/parameters.yaml#/parameters/size'
      - $ref: '../components/parameters.yaml#/parameters/sortBy'
      - $ref: '../components/parameters.yaml#/parameters/sortDir'
      - $ref: '../components/parameters.yaml#/parameters/search'
      - $ref: '../components/parameters.yaml#/parameters/dateFrom'
      - $ref: '../components/parameters.yaml#/parameters/dateTo'
      - name: status
        in: query
        description: Filter by email status
        schema:
          type: string
          enum:
            - pending
            - sent
            - delivered
            - bounced
            - failed
      - name: templateName
        in: query
        description: Filter by template name
        schema:
          type: string
    responses:
      '200':
        description: List of email logs
        content:
          application/json:
            schema:
              $ref: '../schemas/email.yaml#/EmailLogListResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

emailTemplates:
  get:
    tags:
      - admin-emails
    operationId: getEmailTemplates
    summary: List email templates
    description: Returns all email templates
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of email templates
        content:
          application/json:
            schema:
              $ref: '../schemas/email.yaml#/EmailTemplateListResponse'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  post:
    tags:
      - admin-emails
    operationId: createEmailTemplate
    summary: Create email template
    description: Creates a new email template
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/email.yaml#/CreateEmailTemplateRequest'
    responses:
      '201':
        description: Template created
        content:
          application/json:
            schema:
              $ref: '../schemas/email.yaml#/EmailTemplate'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '409':
        description: Template with this name already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

emailTemplate:
  get:
    tags:
      - admin-emails
    operationId: getEmailTemplateById
    summary: Get email template
    description: Returns an email template by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/templateId'
    responses:
      '200':
        description: Email template
        content:
          application/json:
            schema:
              $ref: '../schemas/email.yaml#/EmailTemplate'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '404':
        description: Template not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  put:
    tags:
      - admin-emails
    operationId: updateEmailTemplate
    summary: Update email template
    description: Updates an existing email template
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/templateId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/email.yaml#/UpdateEmailTemplateRequest'
    responses:
      '200':
        description: Template updated
        content:
          application/json:
            schema:
              $ref: '../schemas/email.yaml#/EmailTemplate'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '404':
        description: Template not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'

  delete:
    tags:
      - admin-emails
    operationId: deleteEmailTemplate
    summary: Delete email template
    description: Deletes an email template
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters.yaml#/parameters/templateId'
    responses:
      '204':
        description: Template deleted
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
      '404':
        description: Template not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/Error'
