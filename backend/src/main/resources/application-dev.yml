# Development profile configuration

spring:
  # Use H2 for local development (optional - can use PostgreSQL)
  # datasource:
  #   url: jdbc:h2:mem:itsolutions;DB_CLOSE_DELAY=-1
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Disable email sending in dev
  mail:
    host: localhost
    port: 1025  # MailHog default port

# Disable Turnstile verification in dev
turnstile:
  secret-key: 1x0000000000000000000000000000000AA  # Test key - always passes

# Dev JWT secret — Base64 of "a-256-bit-secret-key-for-dev-only-must-be-32+bytes-long".
# JwtTokenProvider Base64-decodes the value, so a literal non-Base64 string fails at runtime.
# Override via JWT_SECRET env var in any non-dev profile.
jwt:
  secret: YS0yNTYtYml0LXNlY3JldC1rZXktZm9yLWRldi1vbmx5LW11c3QtYmUtMzIrYnl0ZXMtbG9uZw==

# More verbose logging
logging:
  level:
    com.itsolutions: TRACE
    org.springframework.security: DEBUG
