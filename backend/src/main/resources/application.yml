spring:
  application:
    name: itsolutions-backend

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:itsolutions}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Email (SMTP)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:noreply@itsolutions.pl}

# Server
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}   # 24 hours in ms
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in ms

# LLM Configuration
llm:
  primary:  ${LLM_PRIMARY:ollama}    # ollama | gemini
  fallback: ${LLM_FALLBACK:}         # ollama | gemini | <empty> for none
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    api-key: ${OLLAMA_API_KEY:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

# Turnstile (Bot Protection)
turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
  verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Application metadata used by email templates and admin UI links.
app:
  admin:
    email: ${ADMIN_EMAIL:admin@itsolutions.pl}
    url:   ${ADMIN_URL:http://localhost:5173}
  public:
    url:   ${PUBLIC_URL:http://localhost:3000}

# Spring Boot Actuator — only health/info exposed publicly. Rest behind auth.
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # SMTP health probe authenticates against the relay; in dev MailHog has no auth,
    # and in prod we already log every send to email_logs. Skip the actuator probe.
    mail:
      enabled: false

# Rate Limiting
rate-limit:
  enabled: true
  requests-per-minute: ${RATE_LIMIT:60}

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

# Logging
logging:
  level:
    root: INFO
    com.itsolutions: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
